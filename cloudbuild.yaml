steps:
  - name: 'eclipse-temurin:21-jdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew --no-daemon clean build

  # Uses gcloud's managed SSH keys and host-key handling instead of a missing
  # /workspace/ssh_key file or StrictHostKeyChecking=no.
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -print -quit)"
        test -n "$JAR"
        gcloud compute ssh "${_GCE_USER}@${_GCE_INSTANCE_NAME}" \
          --project="$PROJECT_ID" --zone="${_GCE_ZONE}" \
          --command="mkdir -p '${_REMOTE_DIR}'"
        gcloud compute scp "$JAR" \
          "${_GCE_USER}@${_GCE_INSTANCE_NAME}:${_REMOTE_DIR}/app.jar" \
          --project="$PROJECT_ID" --zone="${_GCE_ZONE}"
        gcloud compute ssh "${_GCE_USER}@${_GCE_INSTANCE_NAME}" \
          --project="$PROJECT_ID" --zone="${_GCE_ZONE}" \
          --command="test -s '${_REMOTE_DIR}/app.jar'"
        echo "JAR uploaded and checked. Application restart requires target service configuration."

substitutions:
  _GCE_USER: 'gcpuser'
  _GCE_INSTANCE_NAME: 'springboot-vm'
  _GCE_ZONE: 'us-central1-a'
  _REMOTE_DIR: '/home/gcpuser/app'

timeout: '1200s'
